<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#79314d}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 12% 12%,#fff 0%,transparent 35%),radial-gradient(circle at 92% 72%,#ffd0e1 0%,transparent 50%),linear-gradient(155deg,#ffe7f0,#ffd9e8 66%,#ffe9f3);display:flex;justify-content:center;align-items:center;padding:28px 18px 44px}
main{width:min(100%,450px);text-align:center}
.brand{font-size:37px;font-weight:1000;letter-spacing:1px;color:#f34b87;text-shadow:0 2px #fff,0 4px 10px #ffc4d8;margin:0 0 4px}
.tagline{font-size:13px;color:#ac6785;margin-bottom:24px;font-weight:700}
.card{background:rgba(255,255,255,.83);border:2px solid #fff;border-radius:29px;padding:25px 24px 29px;box-shadow:0 18px 48px #d56c9140,0 2px 7px #d56c9115}
.dog{display:block;width:176px;height:136px;object-fit:cover;object-position:50% 35%;margin:3px auto 18px;border:6px solid white;border-radius:28px;box-shadow:0 6px 22px #ee90b249}
.symbol{display:grid;place-items:center;width:64px;height:64px;margin:4px auto 13px;border-radius:50%;background:#ffedf4;color:#f64780;font-size:33px;font-weight:900;box-shadow:inset 0 0 0 2px white}
h1{margin:3px auto 15px;color:#ed447d;font-size:23px;line-height:1.4}
p{font-size:15px;line-height:1.8;margin:0 0 15px}
.message{min-height:70px}
a.button{display:block;text-decoration:none;color:#fff;background:linear-gradient(#ff9bb8,#fa4d89);border:2px solid #fff;border-radius:999px;padding:16px 12px;font-size:17px;font-weight:850;box-shadow:0 5px 0 #e43f7b,0 10px 22px #ed85a875;margin:14px 0 8px}
.help{font-size:12px;color:#a86b82;line-height:1.8;margin:15px 0 0}
footer{font-size:13px;color:#bd7490;margin-top:24px}

const url = String(cfg.url || "").replace(/\/+$/, "");
if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url) || !cfg.anonKey) {
 show("🐾", "POOMYでログインしてください",
  "認証リンクから戻りましたが、サーバーへの確認ができませんでした。POOMYでログインできるかお試しください。",
  "認証トークンは保存していません。");
 return;
}
fetch(url + "/auth/v1/user", {
 method:"GET",
 headers:{"apikey":cfg.anonKey,"Authorization":"Bearer " + token},
 cache:"no-store",
 referrerPolicy:"no-referrer"
}).then(async response=>{
 if(!response.ok) throw new Error("検証できませんでした");
 const user=await response.json();
 if (!user?.id || !(user.email_confirmed_at || user.confirmed_at)) {
   throw new Error("確認済みの状態が取得できませんでした");
 }
 show("✓", "メール認証が完了しました！",
  "POOMYへの会員登録が確認できました。これからトイプー仲間の友達検索やメッセージ機能をお楽しみいただけます。",
  "下のボタンからPOOMYへ戻り、登録したメールアドレスとパスワードでログインしてください。");
}).catch(()=>{
 show("🐾", "POOMYでログインをお試しください",
  "認証リンクから戻りましたが、認証結果を取得できませんでした。POOMYへ戻り、ログインできれば登録は完了しています。",
  "ログインできない場合は、メールの有効期限や接続設定を確認してください。");
});
})();
</script>
